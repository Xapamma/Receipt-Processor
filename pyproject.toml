[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-processor"
version = "0.1.1"
requires-python = ">=3.11,<3.12"
readme = "README.md"
description = "Process and analyze receipt data"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy<2",
    "ollama>=0.6.1",
    "opencv-python<4.13",
    "pandas>=3.0.1",
    "pathlib>=1.0.1",
    "pillow>=12.1.1",
    "pymupdf>=1.27.2.2",
    "regex>=2026.2.28",
    "setuptools>=81.0.0",
    "tqdm>=4.67.3",
    "streamlit",
    "pydantic>=2.12.5",
    "typing>=3.10.0.0",
    "easyocr>=1.7.2",
    "json-repair>=0.59.4",
    "deepdiff>=9.0.0",
    "quartodoc>=0.11.1",
    "plotly>=6.7.0",
    "torch<2.3",
]

[project.urls]
Homepage = "https://github.com/Xapamma/Receipt-Processor"
Repository = "https://github.com/Xapamma/Receipt-Processor"
Documentation = "https://xapamma.github.io/Receipt-Processor/"

[project.scripts]
receipt-processor-app = "receipt_processor.launcher:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
