[project]
name = "receipt-processor"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy<2",
    "ollama>=0.6.1",
    "opencv-python<4.13",
    "pandas>=3.0.1",
    "pathlib>=1.0.1",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "pymupdf>=1.27.2.2",
    "regex>=2026.2.28",
    "setuptools>=81.0.0",
    "tqdm>=4.67.3",
    "streamlit",
    "streamlit-elements>=0.1.0",
    "matplotlib>=3.10.8",
    "pydantic>=2.12.5",
    "typing>=3.10.0.0",
    "easyocr>=1.7.2",
    "json-repair>=0.59.4",
    "deepdiff>=9.0.0",
    "quartodoc>=0.11.1",
    "plotly>=6.7.0",
    "torch<2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
